name: Deploy MySelfieBooth to IONOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-myselfiebooth-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static Next.js site
        run: npm run build

      - name: Verify exported site
        run: test -f out/index.html

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy out/ to IONOS over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_PORT"
          test -n "$SFTP_PATH"
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --parallel=4 out/ "$SFTP_PATH"
          bye
          EOF

      - name: Notify IndexNow of updated URLs
        continue-on-error: true
        env:
          INDEXNOW_KEY: aa675f6c0ba1190cf0846ddc74337409
        run: |
          node <<'NODE'
          const fs = require('fs');

          (async () => {
            const xml = fs.readFileSync('out/sitemap.xml', 'utf8');
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
              .map((match) => match[1].replaceAll('&amp;', '&'));
            const key = process.env.INDEXNOW_KEY;
            const payload = {
              host: 'myselfiebooth-paris.fr',
              key,
              keyLocation: `https://myselfiebooth-paris.fr/${key}.txt`,
              urlList: urls,
            };

            const response = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'content-type': 'application/json; charset=utf-8' },
              body: JSON.stringify(payload),
            });

            if (![200, 202].includes(response.status)) {
              const body = await response.text();
              throw new Error(`IndexNow ${response.status}: ${body}`);
            }

            console.log(`IndexNow notified for ${urls.length} URLs (HTTP ${response.status}).`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
